name: Update README cards

on:
  schedule:
    - cron: "0 22 * * *" # UTC 22:00 = 北京时间次日 06:00
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: write # 提交生成的 SVG 需要写的权限

jobs:
  build:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats # 提交 / star / PR 的综合概览
          options: "username=${{ github.repository_owner }}&show_icons=true&cache_seconds=1440"
          path: profile/stats.svg 
          token: ${{ secrets.GITHUB_TOKEN }} 
          fail_on_error: "true" # 默认 false 会静默写入一张报错卡片

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=6&cache_seconds=1440"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg
            profile/github-snake-dark.svg?palette=github-dark

      - name: Commit cards
        run: |
          # 用 bot 身份提交，不会算进个人贡献图
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/github-snake.svg profile/github-snake-dark.svg
          # 内容没变就跳过，避免每天产生一个空的 commit
          if git diff --cached --quiet; then
            echo "cards unchanged, skip commit"
            exit 0
          fi
          git commit -m "chore：Update README cards"
          git push 
